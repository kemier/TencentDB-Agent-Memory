# ============================================================
# TDAI Gateway — Mac local (vscode-acp + Ollama light models)
# ============================================================
# LLM: qwen3:14b (thinking, 14B) via local Ollama (L1/L2/L3 extraction — shared Ollama server
#       with bge-m3; summarization is infrequent so overlap is negligible)
# Embedding: bge-m3 (1024d) via Ollama; hybrid recall
# Fallback LLM: vllm-proxy qwythos → 192.168.124.14:8008 (base_url http://127.0.0.1:8317/v1)
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "0.0.0.0"
  apiKey: "local"

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

llm:
  baseUrl: "http://127.0.0.1:11434/v1"
  apiKey: "local"
  model: "qwen3:14b"
  maxTokens: 8192
  timeoutMs: 300000

memory:
  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
    # L1 atom extraction: qwen3:14b thinking model routinely hits the 300s
    # timeout on long Cursor sessions (13k+ char prompts). Use the fast instruct
    # model here; keep qwen3:14b for L2/L3 via llm.model above.
    model: "qwen2.5:1.5b-instruct"

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000

  storeBackend: "sqlite"

  embedding:
    provider: "openai"
    baseUrl: "http://127.0.0.1:11434/v1"
    apiKey: "ollama"
    model: "bge-m3"
    dimensions: 1024
    sendDimensions: false
    timeoutMs: 30000

  bm25:
    enabled: true
    language: "zh"

skill:
  enabled: true
  extraction:
    enabled: true

observability:
  otel:
    enabled: false
  clickhouse:
    enabled: false
  kafka:
    enabled: false
  langfuse:
    enabled: false
