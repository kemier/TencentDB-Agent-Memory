# ============================================================
# TDAI Gateway — Mac local (vscode-acp + Ollama light models)
# ============================================================
# LLM: qwen3.6:35b (Qwen3.6 35B-A3B MoE via Ollama, alias qwen36-35b) for L1/L2/L3
#       memory summarization (persona + scene extraction). Newest non-thinking-by-default
#       agentic build; think suppressed via ollamaThink: false.
# L1 + L2 share qwen3.6:35b (ollamaThink: false) so only one LLM weight
#       is resident (~20GB Q4) + bge-m3 — better fit than L1=7b + L2=distill.
# Embedding: bge-m3 (1024d) via Ollama; hybrid recall
# Fallback LLM: vllm-proxy qwythos → 192.168.124.14:8008 (base_url http://127.0.0.1:8317/v1)
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "0.0.0.0"
  apiKey: "local"

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

llm:
  # Route through responses-vllm-proxy (:8317) so memory + ACP subagents share
  # ONE model (qwen3:30b-a3b on Mac Ollama) and one concurrency gate. Using the
  # SAME model as the subagents means switching between a subagent turn and a
  # memory-extraction turn never evicts (purges) the resident weights — Ollama
  # keeps one llama-server warm. The proxy's /v1/chat/completions handler
  # rewrites mac-provider calls to Ollama-native /api/chat with think:false
  # (mirrors ollama-openai-fetch.ts), so thinking is suppressed even though the
  # gateway's own fetch wrapper is skipped here (baseUrl is no longer :11434).
  # model MUST be the proxy alias, not the backend name — the alias map keys on
  # aliases, else it falls to the default (Ubuntu) provider.
  baseUrl: "http://127.0.0.1:8317/v1"
  apiKey: "local"
  model: "qwen36-35b"
  ollamaThink: false
  maxTokens: 8192
  timeoutMs: 300000

memory:
  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
    # L1 shares the SAME model as llm + subagents (qwen3.6:35b via alias qwen36-35b) so a subagent
    # turn and a memory-extraction turn keep ONE llama-server warm — no weight purge on switch.
    # Inherits llm.ollamaThink: false. Alias (not backend name).
    model: "qwen36-35b"

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000

  storeBackend: "sqlite"

  embedding:
    provider: "openai"
    baseUrl: "http://127.0.0.1:11434/v1"
    apiKey: "ollama"
    model: "bge-m3"
    dimensions: 1024
    sendDimensions: false
    timeoutMs: 30000

  bm25:
    enabled: true
    language: "zh"

skill:
  enabled: true
  extraction:
    enabled: true

observability:
  otel:
    enabled: false
  clickhouse:
    enabled: false
  kafka:
    enabled: false
  langfuse:
    enabled: false
